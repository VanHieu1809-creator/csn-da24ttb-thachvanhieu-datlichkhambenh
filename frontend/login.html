<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Phòng khám Đa khoa Hiếu Tâm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-suitcase-medical"></i></div>
        <div class="brand-text">
          <span class="brand-name">Hiếu Tâm</span>
          <span class="brand-sub">PHÒNG KHÁM ĐA KHOA</span>
        </div>
      </a>
      <a href="index.html" class="btn btn-light-outline">Về trang chủ</a>
    </div>
  </header>

  <section class="section-padding">
    <div class="container">
      <div class="confirm-box" style="max-width:440px; text-align:left;">
        <h2 style="font-size:22px; font-weight:800; color:var(--primary-dark); margin-bottom:6px;">Đăng nhập hệ thống</h2>
        <p style="font-size:13px; color:var(--text-secondary); margin-bottom:20px;">Dành cho bác sĩ và quản trị viên.</p>

        <form id="loginForm" onsubmit="submitLogin(event)">
          <div class="form-group" style="margin-bottom:14px;">
            <label for="loginUser">Email</label>
            <input type="email" id="loginUser" class="form-control" placeholder="Nhập email" autocomplete="username" required>
          </div>
          <div class="form-group" style="margin-bottom:20px;">
            <label for="loginPass">Mật khẩu</label>
            <input type="password" id="loginPass" class="form-control" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
            <button type="button" id="togglePassword" aria-pressed="false" style="margin-top:8px; padding:0; border:0; background:none; color:var(--primary); font:inherit; font-size:12px; cursor:pointer;">Hiện mật khẩu</button>
          </div>
          <p id="loginMessage" role="alert" aria-live="polite" hidden style="margin:0 0 14px; color:var(--danger); font-size:13px;"></p>
          <button type="submit" class="btn btn-primary" style="width:100%;">Đăng nhập</button>
        </form>
      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginMessage = document.getElementById('loginMessage');
    const passwordInput = document.getElementById('loginPass');
    const togglePassword = document.getElementById('togglePassword');
    let loginInProgress = false;

    function showLoginMessage(message) {
      loginMessage.textContent = message;
      loginMessage.hidden = !message;
    }

    togglePassword.addEventListener('click', () => {
      const showPassword = passwordInput.type === 'password';
      passwordInput.type = showPassword ? 'text' : 'password';
      togglePassword.textContent = showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';
      togglePassword.setAttribute('aria-pressed', String(showPassword));
    });

    if (new URLSearchParams(window.location.search).get('reason') === 'session') {
      showLoginMessage('Phiên đăng nhập hết hạn hoặc không đủ quyền. Vui lòng đăng nhập lại.');
    }

    async function submitLogin(e) {
      e.preventDefault();
      if (loginInProgress) return;

      const email = document.getElementById('loginUser').value.trim();
      const password = passwordInput.value;
      const submitButton = loginForm.querySelector('button[type="submit"]');
      loginInProgress = true;
      submitButton.disabled = true;
      submitButton.textContent = 'Đang đăng nhập...';
      showLoginMessage('');
      try {
        const response = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        const token = response.data?.token;
        const user = response.data?.user;
        if (!response.success || !token || !user || !['admin', 'doctor'].includes(user.role)) {
          showLoginMessage('Máy chủ trả về thông tin đăng nhập không hợp lệ. Vui lòng thử lại sau.');
          return;
        }

        localStorage.setItem('token', token);
        localStorage.setItem('user', JSON.stringify(user));
        window.location.href = user.role === 'admin' ? 'admin.html' : 'doctor.html';
      } catch (error) {
        if (error.status === 401) {
          showLoginMessage('Email hoặc mật khẩu không chính xác.');
        } else if (error.status === 403) {
          showLoginMessage('Tài khoản đã bị khóa hoặc không được phép đăng nhập.');
        } else if (error.status === 429) {
          showLoginMessage('Bạn đã đăng nhập quá nhiều lần. Vui lòng thử lại sau.');
        } else if (error.status && error.status < 500) {
          showLoginMessage(error.message || 'Thông tin đăng nhập chưa hợp lệ.');
        } else if (error.status) {
          showLoginMessage('Máy chủ đang gặp sự cố. Vui lòng thử lại sau.');
        } else {
          showLoginMessage('Không thể kết nối đến máy chủ. Vui lòng kiểm tra backend và thử lại.');
        }
      } finally {
        loginInProgress = false;
        submitButton.disabled = false;
        submitButton.textContent = 'Đăng nhập';
      }
    }
  </script>
</body>
</html>
